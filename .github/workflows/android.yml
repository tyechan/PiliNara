name: Android

on:
    push:
        tags:
            - "v*-btr-proxy*"
            - "v2.*"
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
        paths-ignore:
            - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

jobs:
    android:
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event.inputs.build_android == 'true' }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 代码迁出
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: apply Flutter patches
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Write key
              if: ${{ github.event_name != 'pull_request' }}
              run: |
                  if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
                    echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
                    echo storeFile='key.jks' >> android/key.properties
                    echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
                    echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
                    echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties
                  fi

            - name: Set fork version
              run: bash lib/scripts/build_fork.sh

            - name: flutter build apk
              run: flutter build apk --release --split-per-abi --build-name="${{ env.version_name }}" --build-number="${{ env.version_code }}" --dart-define-from-file=pili_release.json --pub

            - name: rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliPala-${{ env.version_name }}-${{ env.commit_hash }}_${abi}.apk"
                  done
              shell: bash

            - name: Release
              if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '') }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
                  name: ${{ format('PiliPala {0} ({1})', env.version, env.version_code) }}
                  body_path: .github/release_body.md
                  target_commitish: ${{ github.sha }}
                  files: |
                      PiliPala-*.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: PiliPala-*_arm64-v8a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_armeabi-v7a
                  path: PiliPala-*_armeabi-v7a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_x86_64
                  path: PiliPala-*_x86_64.apk
